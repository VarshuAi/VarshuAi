<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070f" />
      <stop offset="40%" stop-color="#0a1024" />
      <stop offset="80%" stop-color="#060914" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>

    <!-- Neon Header Gradient -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ccff00" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccff00" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ccff00" stop-opacity="0.6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.07" />
      <circle cx="30" cy="30" r="1" fill="#ccff00" fill-opacity="0.15" />
    </pattern>

    <!-- Radial Glows -->
    <radialGradient id="glowTopLeft" cx="10%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#ccff00" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowBottomRight" cx="90%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes scanline {
        0% { transform: translateY(-280px); }
        100% { transform: translateY(280px); }
      }
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 12px rgba(204, 255, 0, 0.4)); }
        50% { filter: drop-shadow(0 0 24px rgba(56, 189, 248, 0.6)); }
      }
      .hud-title {
        font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 900;
        letter-spacing: 4px;
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .hud-tag {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 11px;
        letter-spacing: 1.5px;
      }
      .live-dot {
        animation: blink 1.6s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="900" height="280" rx="16" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect width="900" height="280" rx="16" fill="url(#cyberGrid)" />
  <rect width="900" height="280" rx="16" fill="url(#glowTopLeft)" />
  <rect width="900" height="280" rx="16" fill="url(#glowBottomRight)" />

  <!-- Corner HUD Accents -->
  <!-- Top-Left -->
  <path d="M 12 32 L 12 12 L 32 12" fill="none" stroke="#ccff00" stroke-width="2.5" stroke-linecap="round" />
  <!-- Top-Right -->
  <path d="M 868 12 L 888 12 L 888 32" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <!-- Bottom-Left -->
  <path d="M 12 248 L 12 268 L 32 268" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <!-- Bottom-Right -->
  <path d="M 868 268 L 888 268 L 888 248" fill="none" stroke="#ccff00" stroke-width="2.5" stroke-linecap="round" />

  <!-- Top System Status Bar -->
  <g transform="translate(36, 38)">
    <!-- Terminal prompt pill -->
    <rect x="0" y="0" width="138" height="24" rx="12" fill="#0d1527" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="14" cy="12" r="4.5" fill="#ccff00" class="live-dot" />
    <text x="26" y="16" fill="#ccff00" class="hud-tag" font-weight="700">KERNEL v3.0</text>

    <!-- Node telemetry -->
    <text x="156" y="16" fill="#64748b" class="hud-tag">// SYSTEM: ONLINE</text>
    <text x="330" y="16" fill="#64748b" class="hud-tag">// NODE: VELORIO-OPS</text>
    <text x="520" y="16" fill="#64748b" class="hud-tag">// ZERO-YAP DEPLOYMENT</text>

    <!-- Right-aligned Status -->
    <rect x="716" y="0" width="112" height="24" rx="6" fill="#0c191a" stroke="#ccff00" stroke-width="1" stroke-opacity="0.5" />
    <text x="772" y="16" fill="#ccff00" class="hud-tag" text-anchor="middle" font-weight="700">PROD READY</text>
  </g>

  <!-- Divider Line -->
  <line x1="36" y1="74" x2="864" y2="74" stroke="#1e293b" stroke-width="1" />
  <line x1="36" y1="74" x2="160" y2="74" stroke="#ccff00" stroke-width="1.5" />

  <!-- Main Hero Brand & Identity -->
  <g transform="translate(450, 138)" text-anchor="middle">
    <!-- Big Cyber Title -->
    <text x="0" y="0" font-size="44" fill="url(#neonGlow)" class="hud-title">VARSHU AI</text>
    
    <!-- Subtitle / Title Description -->
    <text x="0" y="32" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#f8fafc" letter-spacing="2px">
      SOFTWARE ARCHITECT • SYSTEMS ENGINEER • SECURITY RESEARCHER
    </text>

    <!-- Punchy Gen Z Mission Statement -->
    <text x="0" y="56" font-family="'Inter', system-ui, sans-serif" font-size="13" fill="#94a3b8">
      Engineering sovereign tools, autonomous AI agents &amp; hyper-optimized systems · Founder @ Velorio Labs
    </text>
  </g>

  <!-- Bottom Interactive / Telemetry Badges -->
  <g transform="translate(450, 242)" text-anchor="middle">
    <!-- Pill 1: Velorio Labs -->
    <g transform="translate(-250, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0d1527" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">⚡ VELORIO LABS</text>
    </g>

    <!-- Pill 2: 30+ Flagships -->
    <g transform="translate(0, 0)">
      <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#131c12" stroke="#ccff00" stroke-width="1" stroke-opacity="0.6" />
      <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ccff00">🚀 30+ FLAGSHIPS LIVE</text>
    </g>

    <!-- Pill 3: Autonomous Agents -->
    <g transform="translate(250, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#1a1129" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5" />
      <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#c084fc">🧠 AI AGENTS &amp; RECON</text>
    </g>
  </g>
</svg>